<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B:FREE 중구 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
body { margin: 0; }

/* Layout: 왼쪽 패널(검색·필터·목록·범례) + 오른쪽 지도(전국→서울→중구 3단계 확대). 강조색은 점자블록 노랑 하나 */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #141a2e;
  --muted: #535b70;
  --line: #d5d9e3;
  --tactile: #f2c200;
  --tactile-ink: #141a2e;
  --sea: #d9e4f2;
  --off: #e6e8ee;
  --off-hatch: #d3d7e1;
  --off-line: #c3c8d4;
  --land-in: #fbfaf6;
  --road: #ffffff;
  --road-case: #c9ccd6;
  --rail: #8b90a0;
  --water: #9cc3ea;
  --yes: #0b7a43;
  --focus: #1d5cff;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --radius: 10px;
  --base: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #161b2c; --ink: #eef0f6; --muted: #a3aac0; --line: #2b3247;
    --tactile: #f5c518; --tactile-ink: #141a2e; --sea: #0b1426; --off: #171c2d; --off-hatch: #20263a; --off-line: #2b3247;
    --land-in: #222a42; --road: #3d4766; --road-case: #161b2c; --rail: #7d859c; --water: #2f5f93;
    --yes: #4fd18b; --focus: #7aa2ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #161b2c; --ink: #eef0f6; --muted: #a3aac0; --line: #2b3247;
  --tactile: #f5c518; --tactile-ink: #141a2e; --sea: #0b1426; --off: #171c2d; --off-hatch: #20263a; --off-line: #2b3247;
  --land-in: #222a42; --road: #3d4766; --road-case: #161b2c; --rail: #7d859c; --water: #2f5f93;
  --yes: #4fd18b; --focus: #7aa2ff; color-scheme: dark;
}
:root.large { --base: 19px; }

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--base); line-height: 1.5;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 6px; }
.skip:focus { left: max(16px, env(safe-area-inset-left, 0px)); }

/* 상단 */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark {
  width: 40px; height: 40px; border-radius: 8px; flex: none;
  background-color: var(--tactile);
  background-image: radial-gradient(circle, rgba(20,26,46,.28) 2.6px, transparent 3px);
  background-size: 10px 10px;
}
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; letter-spacing: .01em; line-height: 1; }
.brand p { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }
.toggle {
  min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 2px solid var(--ink); background: transparent; font-weight: 700; font-size: .85rem;
}
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* 본문 */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; }
.panel {
  min-width: 0; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 16px;
}
.scope {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
  background: var(--bg); border: 1px solid var(--line); font-size: .85rem;
}
.scope .live { width: 10px; height: 10px; border-radius: 50%; background: var(--yes); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--yes) 25%, transparent); }
.scope b { font-weight: 700; }
.search input {
  width: 100%; min-height: 44px; padding: 0 12px;
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
.search input:focus { border-color: var(--ink); outline: none; }
.search-msg { margin: 6px 0 0; font-size: .85rem; color: var(--muted); }
.search-msg:empty { display: none; }
.label { margin: 0 0 8px; font-size: .78rem; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); font-weight: 500;
}
.chip .ico { font-weight: 700; font-size: .8rem; min-width: 1.4em; text-align: center; }
.chip[aria-pressed="true"] { background: var(--tactile); border-color: var(--tactile); color: var(--tactile-ink); font-weight: 700; }
.filter-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
.count { margin: 0; font-weight: 700; }
.link { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; font-size: .85rem; }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item {
  width: 100%; text-align: left; display: grid; gap: 4px;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface);
}
.item:hover { border-color: var(--muted); }
.item.is-selected { border-color: var(--ink); background: var(--bg); }
.item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item-name { font-weight: 700; font-size: 1.02rem; }
.item-cat { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.item-meta { font-size: .85rem; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .74rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.empty { color: var(--muted); padding: 12px 0; }

.legend { display: grid; gap: 8px; font-size: .82rem; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg .sw { width: 18px; height: 4px; border-radius: 2px; }
.lg .pin-sw { width: 18px; height: 18px; border-radius: 50%; background: var(--tactile); border: 2px solid var(--tactile-ink); display: grid; place-items: center; font-size: .65rem; font-weight: 700; color: var(--tactile-ink); }
.lg .off-sw { width: 18px; height: 14px; border-radius: 3px; border: 1px solid var(--off-line); background: repeating-linear-gradient(45deg, var(--off) 0 3px, var(--off-hatch) 3px 6px); }
.lg .st-sw { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--ink); }
.note { font-size: .75rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; margin: 0; }

/* 지도 */
.map-wrap { position: relative; min-width: 0; min-height: 0; background: var(--sea); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
#lDetail, #lLabel, #lSt, #lEdge { pointer-events: none; }
.water-a { stroke: none; }
.t-water { fill: color-mix(in srgb, var(--water) 60%, var(--ink)); font-weight: 700; letter-spacing: .3em; stroke: none; opacity: .8; }
.st.dim circle { stroke-width: 2; }
.t-st.dim { fill: var(--muted); font-weight: 500; }
.prov { fill: var(--off); stroke: var(--off-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.gu-off { fill: url(#hatch); stroke: var(--off-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.prov, .gu-off { cursor: pointer; }
.isl circle { fill: var(--muted); stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.isl:hover circle { stroke: var(--ink); stroke-width: 2.5; }
.t.t-isl { fill: var(--ink); font-weight: 700; text-anchor: start; }
.prov:hover, .gu-off:hover { stroke: var(--muted); stroke-width: 2; }
.jg-land { fill: var(--land-in); }
.dong { fill: transparent; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.dong.hit { fill: color-mix(in srgb, var(--tactile) 20%, transparent); }
.water-a { fill: var(--water); }
.water-l { fill: none; stroke: var(--water); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.rail { fill: none; stroke: var(--rail); stroke-width: 1.2; opacity: .55; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.road-case { fill: none; stroke: var(--road-case); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.road { fill: none; stroke: var(--road); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.subway { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: .85; vector-effect: non-scaling-stroke; }
.jg-edge { fill: none; stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.jg-edge-glow { fill: none; stroke: var(--tactile); stroke-width: 7; opacity: .55; vector-effect: non-scaling-stroke; }

.t { pointer-events: none; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }
.t-prov { fill: var(--muted); font-weight: 700; }
.t-off { fill: var(--muted); font-weight: 500; opacity: .75; stroke: none; }
.t-gu { fill: var(--muted); font-weight: 700; }
.t-jg { fill: var(--ink); font-family: var(--font-display); }
.t-dong { fill: var(--muted); stroke: none; opacity: .8; }
.t-road { fill: var(--muted); font-weight: 500; }
.t-lm { fill: var(--ink); font-weight: 700; font-style: italic; opacity: .55; stroke: none; }
.t-st { fill: var(--ink); font-weight: 700; text-anchor: start; }

.st circle { fill: var(--surface); stroke-width: 2.5; }
.pin { cursor: pointer; outline: none; }
.pin circle { fill: var(--tactile); stroke: var(--tactile-ink); stroke-width: 2; }
.pin text { fill: var(--tactile-ink); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin .pin-label { fill: var(--ink); stroke: var(--surface); stroke-width: 3; paint-order: stroke; text-anchor: start; }
.pin:hover circle { stroke-width: 3.5; }
.pin.is-selected circle { fill: var(--ink); stroke: var(--tactile); stroke-width: 3; }
.pin.is-selected .pin-num { fill: var(--tactile); }
.pin:focus-visible circle { stroke: var(--focus); stroke-width: 3.5; }

.crumbs {
  position: absolute; z-index: 6; top: 12px; left: 12px; display: flex; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 2px 8px rgba(10,14,30,.08);
}
.crumbs button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; font-size: .85rem; color: var(--muted); }
.crumbs button[aria-current="true"] { background: var(--ink); color: var(--surface); }
.map-tools { position: absolute; z-index: 5; display: flex; flex-direction: column; gap: 6px; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; }
.tool { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 1.1rem; display: grid; place-items: center; }
.attr { position: absolute; z-index: 4; right: 8px; bottom: 6px; font-size: .68rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 1px 6px; border-radius: 4px; }

.tip {
  position: absolute; z-index: 20; pointer-events: none; padding: 6px 10px; border-radius: 8px;
  background: var(--ink); color: var(--surface); font-size: .8rem; font-weight: 500; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 12px));
}
.tip b { font-weight: 700; }
.tip .soon { color: var(--tactile); font-weight: 700; margin-left: 6px; }

.soon-card {
  position: absolute; z-index: 15; left: 50%; bottom: 20px; transform: translateX(-50%);
  width: min(380px, calc(100% - 24px)); display: grid; gap: 10px;
  padding: 16px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--ink);
  box-shadow: 0 10px 28px rgba(10,14,30,.22);
}
.soon-card .badge {
  justify-self: start; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700;
  background: var(--tactile); color: var(--tactile-ink);
}
.soon-card h2 { margin: 0; font-size: 1.15rem; }
.soon-card p { margin: 0; color: var(--muted); font-size: .9rem; }
.soon-card .row { display: flex; gap: 8px; }
.soon-card .row .btn { flex: 1; }

.detail {
  position: absolute; z-index: 10; top: 64px; left: 12px; width: min(330px, calc(100% - 80px));
  max-height: calc(100% - 80px); overflow-y: auto;
  background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius);
  padding: 16px; box-shadow: 0 8px 24px rgba(10,14,30,.18);
}
.detail h2 { margin: 0 40px 2px 0; font-size: 1.2rem; text-wrap: balance; }
.detail .close { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border: 0; background: none; font-size: 1.1rem; }
.flist { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 6px; }
.flist li { display: flex; align-items: center; gap: 8px; }
.flist .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none; }
.flist .yes { font-weight: 700; }
.flist .yes .mk { background: var(--yes); color: var(--surface); }
.flist .no { color: var(--muted); }
.flist .no .mk { border: 1.5px dashed var(--line); }
.near { font-size: .82rem; color: var(--muted); margin: 0 0 12px; }
.actions { display: grid; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 12px; border-radius: var(--radius);
  font-weight: 700; text-decoration: none; border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--tactile); border-color: var(--tactile); color: var(--tactile-ink); }

@media (max-width: 760px) {
  body { overflow: auto; height: auto; min-height: 100%; }
  .layout { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  .map-wrap { order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); overflow: visible; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand p { display: none; }
  .detail { top: auto; bottom: 12px; left: 12px; width: calc(100% - 24px); max-height: 70%; }
  .attr { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<a class="skip" href="#list">시설 목록으로 바로가기</a>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>B:FREE</h1>
      <p>배리어프리 편의시설 지도</p>
    </div>
  </div>
  <button id="fontToggle" class="toggle" aria-pressed="false">가+ 큰 글씨</button>
</header>

<main class="layout">
  <aside class="panel" aria-label="검색, 필터, 시설 목록">
    <div class="scope" role="status"><span class="live" aria-hidden="true"></span><span>현재 서비스 지역 <b>서울 중구</b> · 다른 지역은 서비스 준비 중</span></div>

    <form id="searchForm" class="search" role="search">
      <label for="q" class="sr-only">시설, 역, 동 이름 검색</label>
      <input id="q" type="search" placeholder="시설·역·동 이름 (예: 명동, 충무로)" autocomplete="off">
      <p id="searchMsg" class="search-msg" aria-live="polite"></p>
    </form>

    <section aria-labelledby="filterTitle">
      <h2 id="filterTitle" class="label">필요한 편의시설</h2>
      <div id="filters" class="filters" role="group" aria-labelledby="filterTitle"></div>
      <div class="filter-foot">
        <p id="count" class="count" aria-live="polite"></p>
        <button id="reset" class="link" type="button">초기화</button>
      </div>
    </section>

    <ul id="list" class="list" tabindex="-1" aria-label="시설 목록"></ul>

    <section aria-labelledby="legendTitle">
      <h2 id="legendTitle" class="label">지도 보는 법</h2>
      <div class="legend">
        <div class="legend-row">
          <span class="lg"><span class="pin-sw">4</span>편의시설(숫자=갖춘 개수)</span>
          <span class="lg"><span class="st-sw"></span>지하철역</span>
          <span class="lg"><span class="off-sw"></span>서비스 준비 중 (중구 외 지역)</span>
        </div>
        <div class="legend-row" id="lineLegend"></div>
      </div>
    </section>

    <p class="note">편의시설 15곳은 시연용 샘플이라 실제와 다를 수 있어요. 도로·철도·하천은 OpenStreetMap, 경계는 통계청(2013), 역 좌표는 공개 지하철 데이터를 썼어요.</p>
  </aside>

  <section class="map-wrap" aria-label="지도">
    <svg id="map" role="img" aria-label="전국 지도. 서울 중구만 서비스 중이며 같은 정보는 시설 목록에서도 볼 수 있습니다." xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="8" height="8" fill="var(--off)"></rect>
          <rect width="3" height="8" fill="var(--off-hatch)"></rect>
        </pattern>
      </defs>
      <g id="lProv"></g>
      <g id="lGu"></g>
      <g id="lJg"></g>
      <g id="lDetail"></g>
      <g id="lEdge"></g>
      <g id="lLabel"></g>
      <g id="lSt"></g>
      <g id="lPin"></g>
    </svg>
    <nav class="crumbs" aria-label="지도 범위">
      <button type="button" data-go="nation">전국</button>
      <button type="button" data-go="seoul">서울</button>
      <button type="button" data-go="jg">중구</button>
    </nav>
    <div class="map-tools">
      <button class="tool" id="zoomIn" aria-label="확대">+</button>
      <button class="tool" id="zoomOut" aria-label="축소">−</button>
    </div>
    <div id="tip" class="tip" hidden></div>
    <div id="soon" class="soon-card" role="dialog" aria-labelledby="soonTitle" hidden></div>
    <div id="detail" class="detail" role="region" aria-label="시설 상세" hidden></div>
    <div class="attr">© OpenStreetMap 기여자 · 통계청</div>
  </section>

function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}

const labels = []; // {node, size, min, max}  (min/max: 보이는 viewBox 너비 범위)
function addLabel(cls, x, y, text, size, min, max, angle) {
  const n = el('text', { class: 't ' + cls, x, y }, $('lLabel'), text);
  labels.push({ n, size, min, max, x, y, angle: angle || 0 });
  return n;
}

  const t = el('text', { class: 't t-st' + (s.jg ? '' : ' dim'), x: s.jg ? 8 : 6, y: 0, 'font-size': s.jg ? 11 : 10 }, g, s.name + '역');
  return { ...s, g, t };
});

// 편의시설 핀
const pins = new Map();
FAC.forEach((f) => {
  const g = el('g', { class: 'pin', tabindex: '0', role: 'button', 'aria-label': `${f.name}, 편의시설 ${f.features.length}개. 상세 보기` }, $('lPin'));
  el('circle', { r: 11 }, g);
  el('text', { class: 'pin-num', 'font-size': 11 }, g, f.features.length);
  el('text', { class: 'pin-label', x: 15, y: 4, 'font-size': 11, 'font-weight': 700 }, g, f.name);
  g.addEventListener('click', (e) => { e.stopPropagation(); select(f.id, true); });
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(f.id, true); } });
  pins.set(f.id, g);
});

/* ---------- 확대·이동 ---------- */
const box = (b, pad) => ({ x: b[0] - b[2] * pad, y: b[1] - b[3] * pad, w: b[2] * (1 + 2 * pad), h: b[3] * (1 + 2 * pad) });
const VIEWS = { jg: box(G.jgBox, 0.12), seoul: box(G.seoulBox, 0.06), nation: box(G.nationBox, 0.04) };
const MIN_W = G.jgBox[2] * 0.1, MAX_W = VIEWS.nation.w * 1.6;
let vb = { ...VIEWS.jg };

function fitAspect(v) {
  const r = svg.clientWidth / Math.max(svg.clientHeight, 1);
  const o = { ...v };
  if (o.w / o.h > r) { const nh = o.w / r; o.y -= (nh - o.h) / 2; o.h = nh; }
  else { const nw = o.h * r; o.x -= (nw - o.w) / 2; o.w = nw; }
  return o;
}
const big = () => (document.documentElement.classList.contains('large') ? 1.25 : 1);

function apply() {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s = vb.w / Math.max(svg.clientWidth, 1);
  const B = big();
  // 지도 상세는 서울 단계부터
  const showDetail = vb.w < 12000;
  det.style.display = showDetail ? '' : 'none';
  const showSt = vb.w < 2600;
  $('lSt').style.display = showSt ? '' : 'none';
  $('lPin').style.display = vb.w < 1400 ? '' : 'none';
  // 도로 굵기: 확대할수록 굵게
  const zw = Math.max(1.1, Math.min(9, 520 / vb.w * 4.2));
  roadFill.forEach(([p, w]) => p.style.strokeWidth = zw * w);
  roadCase.forEach(([p, w]) => p.style.strokeWidth = zw * w + 2);

  labels.forEach((L) => {
    const on = vb.w >= L.min && vb.w < L.max;
    L.n.style.display = on ? '' : 'none';
    if (!on) return;
    const fs = L.size * s * B;
    L.n.setAttribute('font-size', fs);
    L.n.setAttribute('stroke-width', fs * 0.28);
    const dy = (+L.n.dataset.dy || 0) * fs;
    L.n.setAttribute('y', L.y + dy);
    if (L.angle) L.n.setAttribute('transform', `rotate(${L.angle} ${L.x} ${L.y + dy})`);
  });
  const showStLabel = vb.w < 760;
  if (showSt) stations.forEach((st) => {
    st.g.setAttribute('transform', `translate(${st.x} ${st.y}) scale(${s * B})`);
    st.t.style.display = showStLabel ? '' : 'none';
    st.t.setAttribute('stroke-width', 3);
  });
  islands.forEach((i) => {
    i.g.setAttribute('transform', `translate(${i.x} ${i.y}) scale(${s * B})`);
    i.tx.setAttribute('stroke-width', 3);
  });
  const showNames = vb.w < 330;
  pins.forEach((g, id) => {
    const f = FAC.find((x) => x.id === id);
    g.setAttribute('transform', `translate(${f.x} ${f.y}) scale(${s * B * (vb.w > 1100 ? 0.75 : 1)})`);
    g.querySelector('.pin-label').style.display = showNames || id === selectedId ? '' : 'none';
  });
  // 현재 단계 표시
  const lvl = vb.w > 9000 ? 'nation' : vb.w > 1400 ? 'seoul' : 'jg';
  document.querySelectorAll('.crumbs button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.go === lvl)));
}

function animateTo(target) {
  target = fitAspect(target);
  const from = { ...vb };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now(), dur = reduce ? 0 : 520;
  // 로그 스케일 보간으로 큰 확대도 자연스럽게
  function step(now) {
    const t = dur ? Math.min((now - t0) / dur, 1) : 1;
    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const w = Math.exp(Math.log(from.w) + (Math.log(target.w) - Math.log(from.w)) * e);
    const fcx = from.x + from.w / 2, fcy = from.y + from.h / 2, tcx = target.x + target.w / 2, tcy = target.y + target.h / 2;
    const k = (from.w === target.w) ? e : (w - from.w) / (target.w - from.w);
    const ccx = fcx + (tcx - fcx) * k, ccy = fcy + (tcy - fcy) * k;
    const h = w * (from.h / from.w);
    vb = { x: ccx - w / 2, y: ccy - h / 2, w, h };
    apply();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function centerOn(x, y, w) {
  const h = w * vb.h / vb.w;
  animateTo({ x: x - w / 2, y: y - h / 2, w, h });
}
function zoomAt(factor, px, py) {
  const r = svg.getBoundingClientRect();
  const mx = vb.x + (px - r.left) / r.width * vb.w;
  const my = vb.y + (py - r.top) / r.height * vb.h;
  const nw = Math.min(Math.max(vb.w * factor, MIN_W), MAX_W);
  const k = nw / vb.w;
  vb = { x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k, w: nw, h: vb.h * k };
  apply();
}

svg.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.18 : 1 / 1.18, e.clientX, e.clientY); }, { passive: false });
const pointers = new Map();
let lastPinch = null, moved = false, downTarget = null;
svg.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.pin')) return;
  downTarget = e.target;
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  svg.classList.add('dragging');
});
svg.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) { hover(e); return; }
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const r = svg.getBoundingClientRect();
  if (pointers.size === 1) {
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
    vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h;
    apply();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) zoomAt(lastPinch / d, (a.x + b.x) / 2, (a.y + b.y) / 2);
    lastPinch = d; moved = true;
  }
  $('tip').hidden = true;
});
['pointerup', 'pointercancel'].forEach((t) => svg.addEventListener(t, (e) => {
  const wasDrag = moved;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinch = null;
  if (!pointers.size) svg.classList.remove('dragging');
  if (t === 'pointerup' && !wasDrag && downTarget) {
    const off = downTarget.closest('.prov, .gu-off');
    if (off) showSoon(off.dataset.name);
  }
  downTarget = null;
}));
svg.addEventListener('pointerleave', () => { $('tip').hidden = true; });

$('zoomIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 1.5, r.left + r.width / 2, r.top + r.height / 2); };
$('zoomOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.5, r.left + r.width / 2, r.top + r.height / 2); };
document.querySelectorAll('.crumbs button').forEach((b) => (b.onclick = () => { hideSoon(); animateTo(VIEWS[b.dataset.go]); }));
new ResizeObserver(() => { vb = fitAspect(vb); apply(); }).observe(svg);

/* ---------- 준비 중 지역 ---------- */
function hover(e) {
  const off = e.target.closest && e.target.closest('.prov, .gu-off');
  const tip = $('tip');
  if (!off || e.pointerType === 'touch') { tip.hidden = true; return; }
  const r = svg.parentElement.getBoundingClientRect();
  tip.innerHTML = `<b>${off.dataset.name}</b><span class="soon">서비스 준비 중</span>`;
  tip.style.left = (e.clientX - r.left) + 'px';
  tip.style.top = (e.clientY - r.top) + 'px';
  tip.hidden = false;
}
function showSoon(name) {
  const c = $('soon');
  c.hidden = false;
  c.innerHTML = `
    <span class="badge">서비스 준비 중</span>
    <h2 id="soonTitle">${name}</h2>
    <p>이 지역은 아직 편의시설 정보를 모으고 있어요. 지금은 <b>서울 중구</b>에서만 이용할 수 있어요.</p>
    <div class="row">
      <button class="btn primary" type="button" id="goJg">중구로 이동</button>
      <button class="btn" type="button" id="closeSoon">닫기</button>
    </div>`;
  $('goJg').onclick = () => { hideSoon(); animateTo(VIEWS.jg); };
  $('closeSoon').onclick = hideSoon;
  $('goJg').focus({ preventScroll: true });
}
function hideSoon() { $('soon').hidden = true; }

/* ---------- 필터 ---------- */
Object.entries(FEATURES).forEach(([key, { label, ico }]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = (ico ? `<span class="ico" aria-hidden="true">${ico}</span>` : '') + label;
  b.onclick = () => {
    active.has(key) ? active.delete(key) : active.add(key);
    b.setAttribute('aria-pressed', String(active.has(key)));
    render();
  };
  $('filters').appendChild(b);
});
$('reset').onclick = () => {
  active.clear(); query = ''; $('q').value = ''; $('searchMsg').textContent = '';
  document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
  render(); animateTo(VIEWS.jg);
};

/* ---------- 검색: 시설 · 역 · 동 · 준비 중 지역 ---------- */
$('q').addEventListener('input', (e) => { query = e.target.value.trim(); $('searchMsg').textContent = ''; render(); });
$('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!query) return;
  const q = query.replace(/역$/, '');
  const v = visible();
  const st = G.stations.find((s) => s.jg && (s.name === q || s.name.includes(q)));
  const stOut = G.stations.find((s) => !s.jg && (s.name === q || s.name.includes(q)));
  const dong = G.dongs.find((d) => d.name.includes(q));
  const otherGu = G.gu.find((g) => g.name.startsWith(q) || q.startsWith(g.name.replace(/구$/, '')));
  const otherProv = G.prov.find((p) => p.name !== '서울특별시' && p.name.startsWith(q.slice(0, 2)));
  if (v.length === 1) select(v[0].id, true);
  else if (st) { centerOn(st.x, st.y, 160); $('searchMsg').textContent = `${st.name}역 (${st.lines.join(', ')})으로 이동했어요.`; }
  else if (dong) { centerOn(dong.c[0], dong.c[1], 220); $('searchMsg').textContent = `${dong.name}으로 이동했어요.`; }
  else if (v.length) { $('searchMsg').textContent = `${v.length}곳을 찾았어요. 목록에서 골라 주세요.`; }
  else if (otherGu) { animateTo(VIEWS.seoul); showSoon('서울 ' + otherGu.name); }
  else if (stOut) { centerOn(stOut.x, stOut.y, 900); showSoon(stOut.name + '역 주변'); }
  else if (otherProv) { animateTo(VIEWS.nation); showSoon(otherProv.name); }
  else $('searchMsg').textContent = `"${query}"에 맞는 결과가 없어요.`;
});

/* ---------- 목록 ---------- */
const matchQuery = (f) => !query || [f.name, f.dong, f.address, f.category].join(' ').includes(query);
const visible = () => FAC.filter((f) => [...active].every((k) => f.features.includes(k)) && matchQuery(f));

function render() {
  const v = visible();
  const ids = new Set(v.map((f) => f.id));
  pins.forEach((g, id) => (g.style.display = ids.has(id) ? '' : 'none'));
  const hit = new Set(v.map((f) => f.dong));
  const filtering = active.size || query;
  Object.entries(dongPaths).forEach(([n, p]) => p.classList.toggle('hit', !!filtering && hit.has(n)));
  const what = active.size ? [...active].map((k) => FEATURES[k].label).join(' + ') : '전체';
  $('count').textContent = `${what} · ${v.length}곳`;
  $('list').innerHTML = v.length ? v.map((f) => `
    <li><button class="item ${f.id === selectedId ? 'is-selected' : ''}" data-id="${f.id}">
      <span class="item-top"><span class="item-name">${f.name}</span><span class="item-cat">${f.category}</span></span>
      <span class="item-meta">${f.dong ?? ''} · ${f.address}</span>
      <span class="tags">${f.features.map((k) => `<span class="tag">${FEATURES[k].label}</span>`).join('')}</span>
    </button></li>`).join('')
    : '<li class="empty">조건에 맞는 시설이 없어요. 필터를 하나 줄이거나 검색어를 지워 보세요.</li>';
  $('list').querySelectorAll('.item').forEach((b) => (b.onclick = () => select(+b.dataset.id, true)));
  apply();
}

/* ---------- 상세 ---------- */
function speak(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; speechSynthesis.speak(u); } catch (_) {}
}
function nearestStation(f) {
  let best = null;
  G.stations.filter((s) => s.jg).forEach((s) => {
    const d = Math.hypot(s.x - f.x, s.y - f.y);
    if (!best || d < best.d) best = { s, d };
  });
  return best ? { ...best, m: Math.round(best.d / G.proj.K * 111320 / 10) * 10 } : null;
}
function select(id, move) {
  const f = FAC.find((x) => x.id === id);
  if (!f) return;
  selectedId = id; hideSoon();
  pins.forEach((g, pid) => g.classList.toggle('is-selected', pid === id));
  $('lPin').appendChild(pins.get(id));
  if (move) centerOn(f.x, f.y, Math.min(Math.max(vb.w, 200), 300));
  const has = Object.keys(FEATURES).filter((k) => f.features.includes(k)).map((k) => FEATURES[k].label);
  const ns = nearestStation(f);
  const d = $('detail');
  d.hidden = false;
  d.innerHTML = `
    <button class="close" aria-label="상세 닫기">✕</button>
    <h2 tabindex="-1">${f.name}</h2>
    <div class="item-meta">${f.category} · ${f.dong ?? ''}<br>${f.address}</div>
    <ul class="flist">${Object.entries(FEATURES).map(([k, v]) => {
      const y = f.features.includes(k);
      return `<li class="${y ? 'yes' : 'no'}"><span class="mk" aria-hidden="true">${y ? '✓' : ''}</span>${v.label}<span class="sr-only">${y ? ' 있음' : ' 정보 없음'}</span></li>`;
    }).join('')}</ul>
    ${ns ? `<p class="near">가까운 역: <b>${ns.s.name}역</b> (${ns.s.lines.join('·')}) · 직선 약 ${ns.m}m</p>` : ''}
    <div class="actions">
      <button class="btn primary" id="readBtn" type="button">🔊 음성으로 듣기</button>
      <a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${encodeURIComponent(f.name)},${f.lat},${f.lng}">카카오맵 길찾기 ↗</a>
    </div>`;
  d.querySelector('.close').onclick = () => { d.hidden = true; selectedId = null; pins.forEach((g) => g.classList.remove('is-selected')); render(); };
  $('readBtn').onclick = () => speak(`${f.name}. ${f.address}. 이용 가능한 편의시설은 ${has.join(', ')}입니다.${ns ? ` 가장 가까운 역은 ${ns.s.name}역입니다.` : ''}`);
  if (!('speechSynthesis' in window)) $('readBtn').hidden = true;
  d.querySelector('h2').focus({ preventScroll: true });
  render();
}

$('fontToggle').onclick = () => {
  const on = document.documentElement.classList.toggle('large');
  $('fontToggle').setAttribute('aria-pressed', String(on));
  apply();
};

vb = fitAspect(VIEWS.jg);
render();
</script>

</body>
</html>
